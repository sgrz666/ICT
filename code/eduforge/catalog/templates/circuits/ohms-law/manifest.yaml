template_id: circuits.ohms_law
title: 欧姆定律与电阻伏安特性
engine_id: circuitjs
status: pending_slice_9               # 方案排期在第 7～8 周切片 9

controls:
  - entity_id: resistor_1
    parameter: resistance
    teaching_label: 电阻阻值
    unit: Ω
    min: 1
    max: 1000
    step: 10
    default: 100
  - entity_id: power_source_1
    parameter: voltage
    teaching_label: 电源电压
    unit: V
    min: 1
    max: 24
    step: 0.5
    default: 5

views:
  - view_id: voltmeter
    teaching_label: 电压表读数
    default_visible: true
  - view_id: ammeter
    teaching_label: 电流表读数
    default_visible: true

notes: >-
  首批排期专注 Ray Optics 单一闭环；本模板作为电路实验保留位，
  待第 7～8 周切片 9 引入 CircuitJS 适配器时正式启用。
