template_id: mechanics.pendulum
title: 单摆周期与简谐振动
engine_id: matter_js
engine_version: "0.20.0"
native_format_version: 1
native_file: native.json
lesson_file: lesson.md
units_per_unit: 1
status: verified

scene_layout:
  - entity_id: pendulum
    native_type: RigidBody
    geometry: { length: 1.0, angle0: 5 }

controls:
  - entity_id: pendulum
    native_type: RigidBody
    parameter: length_m
    native_field: length
    label: 摆长
    unit: m
    min: 0.2
    max: 3.0
    initial: 1.0
  - entity_id: pendulum
    native_type: RigidBody
    parameter: angle0_deg
    native_field: angle0
    label: 初始角
    unit: deg
    min: 1
    max: 30
    initial: 5

views:
  - scene
  - controls
  - measurement_table

exports:
  - single_file_html

routes:
  - config
