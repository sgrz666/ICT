version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: eduforge-postgres
    environment:
      POSTGRES_USER: eduforge
      POSTGRES_PASSWORD: eduforge
      POSTGRES_DB: eduforge
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eduforge -d eduforge"]
      interval: 5s
      timeout: 5s
      retries: 5

  engine-host:
    build:
      context: ..
      dockerfile: infra/engine-host/Dockerfile
    container_name: eduforge-engine-host
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: production
      PORT: 4000

  agent:
    build:
      context: ..
      dockerfile: infra/agent/Dockerfile
    container_name: eduforge-agent
    ports:
      - "8001:8001"
    environment:
      PORT: 8001
      DATABASE_URL: postgresql://eduforge:eduforge@db:5432/eduforge
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
