[project]
name = "eduforge"
version = "0.1.0"
description = "EduForge：复用成熟实验环境的本地 Agent 定制与验证闭环"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.9",
    "playwright>=1.48",
    "pgserver>=0.1.4",
    "asyncpg>=0.32.0",
    "sqlalchemy>=2.1.4",
    "fastapi>=0.143.2",
    "httpx>=0.28.1",
    "langgraph>=1.2.15",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["python/src/eduforge"]

[tool.pytest.ini_options]
testpaths = ["tests/python"]
addopts = "-q"
